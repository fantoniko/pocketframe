name: Publish PocketFrame Server

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - server/**
      - .github/workflows/publish-server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocketframe-server:latest
            ghcr.io/${{ github.repository_owner }}/pocketframe-server:${{ github.sha }}
