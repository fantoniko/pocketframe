services:
  pocketframe-server:
    image: ${POCKETFRAME_IMAGE}
    container_name: pocketframe-server
    restart: unless-stopped
    ports:
      - "${POCKETFRAME_PORT:-8080}:8080"
    environment:
      POCKETFRAME_TOKEN: ${POCKETFRAME_TOKEN}
      POCKETFRAME_MODE: ${POCKETFRAME_MODE:-cover}
      POCKETFRAME_QUALITY: ${POCKETFRAME_QUALITY:-85}
      POCKETFRAME_MAX_UPLOAD_MB: ${POCKETFRAME_MAX_UPLOAD_MB:-15}
      POCKETFRAME_NEXT_POLL_SECONDS: ${POCKETFRAME_NEXT_POLL_SECONDS:-3600}
      POCKETFRAME_RETRY_AFTER_SECONDS: ${POCKETFRAME_RETRY_AFTER_SECONDS:-1800}
    volumes:
      - pocketframe-data:/data

volumes:
  pocketframe-data:
